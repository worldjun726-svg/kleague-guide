name: Deploy to GitHub Pages

# main 브랜치에 push하면 사이트를 빌드해서 GitHub Pages에 올린다.
on:
  push:
    branches: [main]
  # 경기 일정·결과, 선수 순위, 뉴스, 하이라이트를 새로 받아 다시 배포한다.
  # GitHub은 정각(:00)에 몰리는 예약 실행을 늦추거나 건너뛸 수 있어서 정각을 피하고 하루 두 번 돌린다.
  #  - 14:23 UTC = 23:23 KST (그날 저녁 경기가 끝난 뒤)
  #  - 21:23 UTC = 06:23 KST (아침, 밤사이 갱신된 기록·뉴스 반영)
  schedule:
    - cron: '23 14 * * *'
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # 공식 홈페이지에서 새로 끝난 경기만 추가로 받는다. 실패하면 저장소에 커밋된 자료로 그대로 배포한다.
      - run: node scripts/fetch-matches.mjs
        continue-on-error: true
      # 공식 기록실에서 리그별 선수 순위(득점·도움·출전 등 상위 30명)를 새로 받는다. 실패하면 커밋된 자료로 배포한다.
      - run: node scripts/fetch-player-ranks.mjs
        continue-on-error: true
      # 공식 홈페이지의 구단·리그 소식 목록을 새로 받는다(홈 화면 MY 팀 뉴스). 실패하면 커밋된 자료로 배포한다.
      - run: node scripts/fetch-news.mjs
        continue-on-error: true
      # 공식 홈페이지 영상에서 구단별 하이라이트(최근 4개)를 새로 받는다. 실패하면 커밋된 자료로 배포한다.
      - run: node scripts/fetch-highlights.mjs
        continue-on-error: true
      # tsc -b는 tests 폴더의 기존 타입 오류로 멈추므로, 사이트 빌드만 실행한다.
      - run: npm run build:bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
