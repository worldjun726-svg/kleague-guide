name: Deploy to GitHub Pages

# main 브랜치에 push하면 사이트를 빌드해서 GitHub Pages에 올린다.
on:
  push:
    branches: [main]
  # 매일 오전 6시(KST)에 경기 일정·결과를 새로 받아 다시 배포한다.
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # 공식 홈페이지에서 새로 끝난 경기만 추가로 받는다. 실패하면 저장소에 커밋된 자료로 그대로 배포한다.
      - run: node scripts/fetch-matches.mjs
        continue-on-error: true
      # tsc -b는 tests 폴더의 기존 타입 오류로 멈추므로, 사이트 빌드만 실행한다.
      - run: npm run build:bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
